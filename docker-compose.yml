services:
  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - frontend
      - user-service
      - product-service
      - order-service
    networks: [bookstore-net]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - API_BASE=http://localhost:8000
    networks: [bookstore-net]

  user-service:
    build: ./user-service
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://user-db:27017/bookstore
      - MONGO_DB=bookstore
      - JWT_SECRET=lab5-bookstore-secret
    depends_on:
      user-db:
        condition: service_healthy
    networks: [bookstore-net]

  product-service:
    build: ./product-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PGHOST=product-db
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=products
      - PGPORT=5432
    depends_on:
      product-db:
        condition: service_healthy
    networks: [bookstore-net]

  order-service:
    build: ./order-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PGHOST=order-db
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=orders
      - PGPORT=5432
      - RABBITMQ_URL=amqp://message-broker:5672
      - PRODUCT_SERVICE_URL=http://product-service:8002
    depends_on:
      order-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      product-service:
        condition: service_started
    networks: [bookstore-net]

  # Datastores
  user-db:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - user-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [bookstore-net]

  product-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=products
    volumes:
      - product-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d products"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [bookstore-net]

  order-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orders
    volumes:
      - order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [bookstore-net]

  message-broker:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [bookstore-net]

volumes:
  user-data:
  product-data:
  order-data:

networks:
  bookstore-net:
