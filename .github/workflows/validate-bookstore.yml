name: Validate Bookstore Microservices

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build and start all services
        run: docker compose up --build -d

      - name: Wait for all API routes
        shell: bash
        run: |
          for attempt in {1..60}; do
            PRODUCT_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:8000/api/products || true)
            USER_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:8000/api/users/me || true)
            ORDER_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:8000/api/orders || true)

            echo "Attempt $attempt: products=$PRODUCT_STATUS users=$USER_STATUS orders=$ORDER_STATUS"
            if [ "$PRODUCT_STATUS" = "200" ] \
              && [ "$USER_STATUS" = "401" ] \
              && [ "$ORDER_STATUS" = "200" ]; then
              echo "All bookstore API routes are ready."
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Test registration, product and order flow
        shell: bash
        run: |
          set -euo pipefail

          if ! curl --fail-with-body --show-error --silent \
            -X POST http://localhost:8000/api/users/register \
            -H "Content-Type: application/json" \
            -d '{"username":"github-actions","password":"Lab5Test123"}' \
            --output register-response.json; then
            cat register-response.json || true
            exit 1
          fi
          cat register-response.json
          TOKEN=$(jq -r '.token' register-response.json)
          test -n "$TOKEN"
          test "$TOKEN" != "null"

          curl --fail-with-body --show-error --silent \
            http://localhost:8000/api/users/me \
            -H "Authorization: Bearer $TOKEN" \
            | jq -e '.username == "github-actions"'

          if ! curl --fail-with-body --show-error --silent \
            -X POST http://localhost:8000/api/products \
            -H "Content-Type: application/json" \
            -d '{"title":"Clean Code","author":"Robert C. Martin","price":25.50,"stock":20}' \
            --output product-response.json; then
            cat product-response.json || true
            exit 1
          fi
          cat product-response.json
          PRODUCT_ID=$(jq -r '.id' product-response.json)
          test "$PRODUCT_ID" -gt 0

          if ! curl --fail-with-body --show-error --silent \
            -X POST http://localhost:8000/api/orders \
            -H "Content-Type: application/json" \
            -d "{\"productId\":$PRODUCT_ID,\"quantity\":2}" \
            --output order-response.json; then
            cat order-response.json || true
            exit 1
          fi
          cat order-response.json
          ORDER_ID=$(jq -r '.id' order-response.json)
          test "$ORDER_ID" -gt 0

          curl --fail-with-body --show-error --silent \
            http://localhost:8000/api/products/$PRODUCT_ID \
            | jq -e --argjson id "$PRODUCT_ID" '.id == $id'
          curl --fail-with-body --show-error --silent \
            http://localhost:8000/api/orders/$ORDER_ID \
            | jq -e --argjson id "$ORDER_ID" '.id == $id and .status == "PENDING"'

          # Verify the exact direct service endpoints required by Lab5.pdf.
          curl --fail-with-body --show-error --silent \
            http://localhost:8002/products \
            | jq -e --argjson id "$PRODUCT_ID" 'any(.[]; .id == $id)'
          curl --fail-with-body --show-error --silent \
            http://localhost:8002/products/$PRODUCT_ID \
            | jq -e --argjson id "$PRODUCT_ID" '.id == $id'

          curl --fail-with-body --show-error --silent \
            -X POST http://localhost:8001/users/register \
            -H "Content-Type: application/json" \
            -d '{"username":"github-actions-direct","password":"Lab5Test123"}' \
            | jq -e '.token | length > 0'

          curl --fail-with-body --show-error --silent \
            -X POST http://localhost:8003/orders \
            -H "Content-Type: application/json" \
            -d "{\"productId\":$PRODUCT_ID,\"quantity\":1}" \
            | jq -e '.id > 0 and .status == "PENDING"'

      - name: Verify RabbitMQ event
        shell: bash
        run: |
          set -euo pipefail
          docker compose logs order-service \
            | grep -F "Published ORDER_CREATED event to RabbitMQ"

          for attempt in {1..30}; do
            if curl --fail --silent -u guest:guest \
              http://localhost:15672/api/queues/%2F/order.created \
              | jq -e '.name == "order.created"' > /dev/null; then
              echo "RabbitMQ queue order.created exists."
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Collect Docker evidence
        if: always()
        shell: bash
        run: |
          docker compose ps > compose-status.txt || true
          docker compose logs --no-color > docker-compose.log || true

      - name: Upload Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-docker-evidence
          path: |
            compose-status.txt
            docker-compose.log

      - name: Stop services
        if: always()
        run: docker compose down -v
